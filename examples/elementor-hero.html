<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloudia Elementor Hero Fixture</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #060913;
        color: white;
      }

      .cloudia-hero {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 60vh;
        min-height: 420px;
        overflow: hidden;
        background: #0b1020;
      }

      .cloudia-brand {
        position: relative;
        z-index: 3;
        max-width: 100%;
        padding: 0 5vw;
        font-size: clamp(58px, 16vw, 220px);
        font-weight: 850;
        line-height: 0.88;
        letter-spacing: 0;
        color: rgba(255, 255, 255, 0.76);
        opacity: 0.46;
        mix-blend-mode: soft-light;
        pointer-events: none;
        text-shadow: 0 1px 28px rgba(255, 255, 255, 0.24);
        white-space: nowrap;
      }

      #cloudia-mount {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <section class="cloudia-hero">
      <div class="cloudia-brand">CLOUDIA</div>
      <div id="cloudia-mount"></div>
    </section>

    <script src="../dist/cloudia-hero.iife.js"></script>
    <script>
      CloudiaHero.mount("#cloudia-mount", { handTracking: false });
    </script>
  </body>
</html>
